    return `<tr><td><button class="code" data-act="course" data-code="${esc(code)}">${esc(code)}</button><div class="muted" style="font-size:.8rem">${esc(c.name || '')}</div></td>
      <td><span class="frac">${st.watched}/${st.total}</span> <span class="muted">watched</span>${st.due ? `<div><span class="pill due">${st.due} review${st.due > 1 ? 's' : ''} due</span></div>` : ''}</td>
      <td style="min-width:140px">${qn ? stack(st.q) + `<div class="muted" style="font-size:.8rem;margin-top:3px">${st.q.green}/${qn} done</div>` : '<span class="muted">no papers</span>'}</td>
      <td style="min-width:110px">${tn ? stack(st.tq) + `<div class="muted" style="font-size:.8rem;margin-top:3px">${c.tripos.length} paper${c.tripos.length > 1 ? 's' : ''}</div>` : '<span class="muted">—</span>'}</td></tr>`;
  }).join('');
  return `
  <h1 class="ov-title">Overview</h1>
  <div class="ov-grid">
    <div>
      <div class="sheet">
        <h2>Today</h2>
        ${items.length ? `<ul class="items">${items.slice(0, 40).map(it => `<li><button data-act="goto" data-code="${esc(it.code)}" data-tab="${it.tab}" ${it.pid ? `data-pid="${it.pid}"` : ''}>
          <span class="dot ${it.kind}"></span><span class="k">${esc(it.code)}</span><span class="t">${esc(it.text)}</span><span class="s">${esc(it.sub)}</span></button></li>`).join('')}</ul>`
          : `<p class="muted">Nothing due. Lectures to watch, reviews due and newly unlocked questions appear here.</p>`}
      </div>
      <div class="sheet">
        <h2>Courses</h2>
        <div style="overflow-x:auto"><table class="ledger"><thead><tr><th>Course</th><th>Lectures</th><th>Examples papers</th><th>Tripos</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
    </div>
    <div>
      <div class="sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>For supervisions</h2>${qs.length ? '<button class="btn" data-act="copy-q">Copy list</button>' : ''}</div>
        ${qs.length ? `<ul class="q-list">${qs.map(x => `<li><i class="st-${x.st}"></i><div><b>${esc(x.code)}</b> ${esc(x.where)}, Q${x.q}${x.comment ? `<div class="muted">${esc(x.comment)}</div>` : ''}</div></li>`).join('')}</ul>`
          : `<p class="muted">Questions you mark red (can’t do) or yellow (query) collect here, with your comments, ready to take to a supervision.</p>`}
      </div>
    </div>
  </div>`;
}

/* ---------- Course ---------- */
function courseView(c) {
  const t = c.tab;
  const tab = (id, label, n) => `<button class="tab ${t === id ? 'on' : ''}" data-act="tab" data-tab="${id}">${label}<span class="n">${n}</span></button>`;
  const total = c.lectures.length;
  const span = total ? `${fmtShort(new Date(c.lectures[0].start))} – ${fmtShort(new Date(c.lectures[total - 1].start))}` : 'no lectures yet';
  return `
  <header class="course-head">
    <h1>${esc(c.code)}</h1>
    <div class="meta"><input class="cname" data-f="cname" value="${esc(c.name || '')}" placeholder="Course title" aria-label="Course title"><small>${total} lectures, ${span}</small></div>
    <button class="btn danger" data-act="del-course">Remove course</button>
  </header>
  <nav class="tabs" role="tablist">
    ${tab('lectures', 'Lectures', total)}
    ${tab('examples', 'Examples papers', c.papers.length)}
    ${tab('tripos', 'Tripos papers', c.tripos.length)}
  </nav>
  ${t === 'examples' ? examplesTab(c) : t === 'tripos' ? triposTab(c) : lecturesTab(c)}`;
}

function lecturesTab(c) {
  const iv = S.settings.intervals;
  const head = `<tr><th>Lecture</th><th title="Where in the lecture notes this lecture got to, e.g. p.14, §2.3 or end of section 2">Notes covered to</th><th>1st watch</th>${Array.from({ length: c.reviewCols }, (_, k) => `<th>${ordinal(k + 2)} review</th>`).join('')}
    <th><button class="icon" data-act="add-col" title="Add a review column" aria-label="Add a review column" style="color:var(--blue)">＋</button>${c.reviewCols > 1 ? `<button class="icon" data-act="rm-col" title="Remove last review column" aria-label="Remove last review column">−</button>` : ''}</th>
    <th>Next review</th><th>Notes</th><th></th></tr>`;
  const t = todayStr();
  const rows = c.lectures.map((l, i) => {
    const d = new Date(l.start), future = ymd(d) > t;
    const ends = Object.entries(c.sections).filter(([, s]) => +s.after === i + 1).map(([k]) => 'Section ' + k).join(', ');
    const prevCov = (c.lectures.slice(0, i).reverse().find(x => x.covered) || {}).covered;
    let cells = `<td class="c-cov"><input data-f="lcov" data-i="${i}" value="${esc(l.covered || '')}" placeholder="${future ? '' : 'e.g. p.14, §2.3'}" aria-label="Lecture ${i + 1} notes covered up to">${prevCov ? `<span class="hint">from ${esc(prevCov)}</span>` : ''}</td>`;
    cells += `<td>${l.watched ? dateCell('wdate', i, null, l.watched) : `<button class="stamp" data-act="watch" data-i="${i}" title="Stamps the lecture date; edit it afterwards if you watched later">Mark watched</button>`}</td>`;
    for (let k = 0; k < c.reviewCols; k++) {
      const v = l.reviews[k], prevOk = k === 0 ? !!l.watched : !!l.reviews[k - 1];
      cells += `<td>${v ? dateCell('rdate', i, k, v) : prevOk && k === l.reviews.length ? `<button class="stamp ghost" data-act="rev" data-i="${i}" data-k="${k}">Log today</button>` : '<span class="dash">–</span>'}</td>`;
    }
    return `<tr class="${future ? 'future' : ''}">
      <th scope="row" class="rowh" title="${esc(l.title)}${l.location ? '\n' + esc(l.location) : ''}"><span class="ln">L${i + 1}</span>${c.editLec === l.id
        ? `<span class="lw"><input type="datetime-local" data-f="lecdt" data-i="${i}" value="${localDT(d)}" aria-label="Date and time of lecture ${i + 1}"><button class="icon" data-act="edit-lec-done" aria-label="Save lecture date" title="Save (Enter). Esc cancels">✓</button></span>`
        : `<button class="lw lec-edit" data-act="edit-lec" data-i="${i}" title="Change date or time"><span class="ld">${fmtDay(d)}</span><span class="lt">${fmtTime(d)}${l.location ? ', ' + esc(l.location) : ''}</span></button>`}${ends ? `<span class="sec-tag">${ends} ends</span>` : ''}</th>
      ${cells}<td></td><td>${dueBadge(l, future)}</td>
      <td class="c-note"><input data-f="lnote" data-i="${i}" value="${esc(l.note || '')}" placeholder="Notes" aria-label="Notes for lecture ${i + 1}"></td>
      <td><button class="icon" data-act="del-lec" data-i="${i}" aria-label="Delete lecture ${i + 1}" title="Delete lecture">×</button></td></tr>`;
  }).join('');
  return `
  <div class="toolbar">
    <span class="muted grow">Reviews are suggested ${iv.map((d, k) => `${d} d after the ${k ? ordinal(k + 1) + ' review' : 'first watch'}`).join(', ')}.</span>
    <button class="btn" data-act="add-lec">Add lecture</button>
    <button class="btn" data-act="pick-file">Import .ics…</button>
  </div>
  ${c.lectures.length ? `<div class="scroll"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
    : `<div class="dropzone" data-drop="any"><p><b>No lectures yet.</b> Drop this course’s .ics timetable here; lectures are added and numbered by date.</p></div>`}`;
}
function dateCell(f, i, k, v) {
  const kk = k != null ? `data-k="${k}"` : '';
  return `<span class="dcell"><input type="date" data-f="${f}" data-i="${i}" ${kk} value="${esc(v)}" aria-label="Date"><button class="icon" data-act="${f === 'wdate' ? 'unwatch' : 'rev-clear'}" data-i="${i}" ${kk} aria-label="Clear date" title="Clear">×</button></span>`;
}
function dueBadge(l, future) {
  if (future && !l.watched) return '<span class="pill muted">Upcoming</span>';
  if (!l.watched) return '<span class="pill warn">To watch</span>';
  const nd = nextDue(l);
  if (nd.done) return '<span class="pill ok">Reviews done</span>';
  const diff = daysBetween(todayStr(), nd.date), lab = ordinal(nd.which + 2) + ' review', tip = `title="${lab} was due ${fmtDay(parseYmd(nd.date))}"`;
  if (diff < 0) return `<span class="pill late" ${tip}>${lab} overdue by ${-diff} d</span>`;
  if (diff === 0) return `<span class="pill due" ${tip}>${lab} due today</span>`;
  return `<span class="pill muted" title="${lab} due ${fmtDay(parseYmd(nd.date))}">${lab} in ${diff} d</span>`;
}

const LEGEND = `<div class="legend"><span><i class="st-grey"></i>Not time yet</span><span><i class="st-white"></i>Ready, not done</span><span><i class="st-red"></i>Can’t do</span><span><i class="st-yellow"></i>Slight query</span><span><i class="st-green"></i>Done, no issues</span></div>`;
const STATUSES = [['', 'white', 'Not done'], ['red', 'red', 'Can’t do'], ['yellow', 'yellow', 'Query'], ['green', 'green', 'Done']];

function sectionsPanel(c) {
  const ks = Object.keys(c.sections).sort(numSort);
  if (!ks.length) return '';
  const unmapped = ks.filter(k => !c.sections[k].after && !c.sections[k].done).length;
  return `<div class="sheet sections"><h3>Handout sections</h3>
    <p class="muted">${unmapped ? 'Choose the lecture that finishes each section. Questions tied to a section stay grey until that lecture has happened.' : `Questions unlock once the finishing lecture has ${S.settings.unlockMode === 'watched' ? 'been marked watched' : 'taken place'}.`}</p>
    <div class="sec-grid">${ks.map(k => {
      const s = c.sections[k], open = isUnlocked(c, 'S' + k);
      const ctrl = c.lectures.length
        ? `<select data-f="secafter" data-k="${k}" aria-label="Section ${k} ends after"><option value="">choose lecture</option>${c.lectures.map((l, i) => `<option value="${i + 1}" ${+s.after === i + 1 ? 'selected' : ''}>L${i + 1}, ${fmtDay(new Date(l.start))}</option>`).join('')}</select>`
        : `<input type="number" min="1" data-f="secafter" data-k="${k}" value="${s.after || ''}" style="width:70px" aria-label="Section ${k} ends after lecture">`;
      return `<div class="sec ${open ? 'open' : ''}"><span class="sn">Section ${k}</span><label>Ends after ${ctrl}</label><label class="chk"><input type="checkbox" data-f="secdone" data-k="${k}" ${s.done ? 'checked' : ''}> Finished (override)</label></div>`;
    }).join('')}</div></div>`;
}
function examplesTab(c) {
  const p = c.papers.find(x => x.id === c.activePaper) || c.papers[0];
  return `
  <div class="dropzone" data-drop="paper">
    <p><b>Drop examples paper PDFs here.</b> <span class="muted">Several at once is fine, cribs included. You’ll see what was detected (course, paper number, questions) and can correct it before anything is added.</span></p>
    <button class="btn" data-act="add-paper">Add paper without PDF</button>
  </div>
  ${sectionsPanel(c)}
  ${c.papers.length ? `<div class="subtabs" role="tablist">${c.papers.map(x => {
    const q = { green: 0, yellow: 0, red: 0, white: 0, grey: 0 }; x.questions.forEach((_, i) => q[qState(c, x, i)]++);
    return `<button class="subtab ${p && x.id === p.id ? 'on' : ''}" data-act="paper" data-id="${x.id}">Paper ${esc(x.num)} ${x.questions.length ? stack(q) : ''}</button>`;
  }).join('')}</div>` : ''}
  ${p ? paperView(c, p) : `<details class="sched" open>${schedBox(c)}</details>`}`;
}
function schedBox(c) {
  return `<summary>When can each question be done?</summary><div class="in">
    <p class="muted">Paste the lecturer’s guide below, or drop or paste a screenshot, text file or PDF of it. Lines like “Section 2: P1:Q6,7” or “Lecture 4: Q1, Q3” are understood, and a heading such as “Examples Paper 2:” makes the lines after it apply to that paper. It applies to every paper in this course.</p>
    <textarea data-f="schedtext" data-drop="sched" placeholder="Section 1: P1:Q5&#10;Section 2: P1:Q6,7&#10;Section 3: n/a&#10;…" aria-label="Question guide">${esc(c.scheduleText)}</textarea>
    <div class="btn-row"><button class="btn primary" data-act="apply-sched">Apply to questions</button>
    <label class="btn">Read from screenshot or file…<input type="file" accept="image/*,.txt,.pdf" data-f="schedfile" hidden></label>
    <span class="ocr-status" id="ocr-status"></span></div>${schedSummary(c)}</div>`;
}
function schedSummary(c) {
  const nums = Object.keys(c.schedule || {}).sort(numSort);
  if (!nums.length) return '';
  const tLabel = t => t[0] === 'S' ? 'Section ' + t.slice(1) : 'Lecture ' + t.slice(1);
  return `<div class="sched-sum"><b>Understood as</b>${nums.map(n => {
    const groups = {};
    Object.entries(c.schedule[n]).sort((a, b) => a[0] - b[0]).forEach(([q, t]) => (groups[t] ||= []).push('Q' + q));
    const order = Object.keys(groups).sort((a, b) => a[0].localeCompare(b[0]) || a.slice(1) - b.slice(1));
    const p = c.papers.find(x => x.num === n);
    return `<div class="sum-row"><span class="sum-p">Paper ${esc(n)}${p ? '' : ' <small>(not added yet)</small>'}</span><span>${order.map(t => `${tLabel(t)}: ${groups[t].join(', ')}`).join('<span class="sep"> · </span>')}</span></div>`;
  }).join('')}<p class="muted" style="font-size:.8rem;margin:6px 0 0">Questions not listed are treated as ${S.settings.unscheduled === 'available' ? 'available any time' : 'locked'} (change this in Backup &amp; settings). If this is wrong, edit the text above and apply again.</p></div>`;
}
function qTable(c, p, kind) {
  const isP = kind === 'paper';
  const rows = p.questions.map((q, i) => {
    const st = isP ? qState(c, p, i) : (q.status || 'white');
    const dd = `data-kind="${kind}" data-pid="${p.id}" data-q="${i}"`;
    const eff = isP ? effUnlock(c, p, i) : '';
    return `<tr>
      <th scope="row" class="rowh" style="min-width:76px"><button class="qcell st-${st}" data-act="qcycle" ${dd} title="${ST_LABEL[st]} — click to cycle status">Q${i + 1}</button></th>
      ${isP ? `<td class="c-unlock"><input data-f="qunlock" ${dd} value="${esc(eff)}" placeholder="any" aria-label="Q${i + 1} available after"><span class="hint">${esc(describeUnlock(c, eff))}${q.unlock != null ? ' (edited)' : ''}</span></td>` : ''}
      <td><span class="seg">${STATUSES.map(([v, cls, lab]) => `<button class="sbtn ${q.status === v ? 'on' : ''}" data-act="qs" ${dd} data-s="${v}" aria-pressed="${q.status === v}"><i class="st-${cls}"></i>${lab}</button>`).join('')}</span></td>
      <td><input type="date" data-f="qdate" ${dd} value="${esc(q.date)}" aria-label="Q${i + 1} date"></td>
      ${!isP ? `<td class="c-time"><input type="number" min="0" data-f="qtime" ${dd} value="${esc(q.time)}" placeholder="min" aria-label="Q${i + 1} minutes taken"></td>` : ''}
      <td style="text-align:center"><input type="checkbox" data-f="qcrib" ${dd} ${q.crib ? 'checked' : ''} aria-label="Q${i + 1} checked against crib"></td>
      <td class="c-com"><textarea rows="1" data-f="qcom" ${dd} placeholder="Comment" aria-label="Q${i + 1} comment">${esc(q.comment)}</textarea></td></tr>`;
  }).join('');
  return `<div class="scroll"><table class="tbl"><thead><tr><th>Question</th>${isP ? '<th>Available after</th>' : ''}<th>Status</th><th>Date</th>${!isP ? '<th>Time</th>' : ''}<th>Crib</th><th>Comment</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function moveSelect(c, dd) {
  if (S.order.length < 2) return '';
  return `<label class="move">Course <select data-f="pmove" ${dd} aria-label="Move to another course">${S.order.map(k => `<option value="${esc(k)}" ${k === c.code ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></label>`;
}
function pdfButtons(p, dd) {
  const one = (which, label) => p[which]
    ? `<span class="pdfpair"><button class="btn" data-act="pdf" data-key="${p[which]}">Open ${label}</button><label class="btn" title="Replace the ${label} PDF">Replace<input type="file" accept=".pdf,application/pdf" hidden data-f="pfile" data-which="${which}" ${dd}></label></span>`
    : `<label class="btn">Attach ${label} PDF<input type="file" accept=".pdf,application/pdf" hidden data-f="pfile" data-which="${which}" ${dd}></label>`;
  return one('pdf', 'paper') + one('crib', 'crib');
}
function paperView(c, p) {
  const dd = `data-kind="paper" data-pid="${p.id}"`;
  return `
  <div class="paper-head">
    <h2 class="pnum-h">Examples paper <input class="pnum" data-f="pnum" ${dd} value="${esc(p.num)}" inputmode="numeric" aria-label="Paper number" title="Change the paper number"></h2>
    <input class="ptitle" data-f="ptitle" ${dd} value="${esc(p.title || '')}" placeholder="Topic" aria-label="Paper topic">
    ${moveSelect(c, dd)}
    <span class="nq">Questions <button class="icon" data-act="nq" ${dd} data-d="-1" aria-label="One fewer question">−</button><b>${p.questions.length}</b><button class="icon" data-act="nq" ${dd} data-d="1" aria-label="One more question">+</button></span>
    ${pdfButtons(p, dd)}
    <button class="btn danger" data-act="del-paper" ${dd}>Delete</button>
  </div>
  <details class="sched" ${c.scheduleText ? '' : 'open'}>${schedBox(c)}</details>
  ${LEGEND}
  ${p.questions.length ? qTable(c, p, 'paper') : `<p class="muted" style="margin-top:12px">No questions yet. Use + to add them.</p>`}
  <p class="muted" style="font-size:.82rem;margin-top:8px">“Available after” takes L4 (after lecture 4), S2 (after section 2), a date like 2026-11-03, or blank. Click a question number to cycle its status.</p>`;
}
function triposTab(c) {
  const p = c.tripos.find(x => x.id === c.activeTrip) || c.tripos[0];
  const dd = p ? `data-kind="trip" data-pid="${p.id}"` : '';
  return `
  <div class="dropzone" data-drop="tripos">
    <p><b>Drop past tripos papers here.</b> <span class="muted">The year comes from the file name or the paper itself; files named with “crib” attach as the crib for that year.</span></p>
    <button class="btn" data-act="add-trip">Add year without PDF</button>
  </div>
  ${c.tripos.length ? `<div class="subtabs">${c.tripos.map(x => {
    const q = { green: 0, yellow: 0, red: 0, white: 0, grey: 0 }; x.questions.forEach(y => q[y.status || 'white']++);
    return `<button class="subtab ${p && x.id === p.id ? 'on' : ''}" data-act="trip" data-id="${x.id}">${esc(x.year)} ${stack(q)}</button>`;
  }).join('')}</div>` : ''}
  ${p ? `<div class="paper-head"><h2 class="pnum-h">Tripos <input class="pnum pyear" data-f="tyear" ${dd} value="${esc(p.year)}" inputmode="numeric" aria-label="Year" title="Change the year"></h2>${moveSelect(c, dd)}<span style="flex:1"></span>
      <span class="nq">Questions <button class="icon" data-act="nq" ${dd} data-d="-1" aria-label="One fewer question">−</button><b>${p.questions.length}</b><button class="icon" data-act="nq" ${dd} data-d="1" aria-label="One more question">+</button></span>
      ${pdfButtons(p, dd)}
      <button class="btn danger" data-act="del-trip" ${dd}>Delete</button></div>
    ${LEGEND.replace('<span><i class="st-grey"></i>Not time yet</span>', '')}
    ${qTable(c, p, 'trip')}` : ''}`;
}

/* ---------- Settings ---------- */
function settingsView() {
  const s = S.settings;
  const orig = location.origin && location.origin !== 'null' ? location.origin : 'https://YOUR-NAME.github.io';
  return `
  <h1 class="ov-title">Backup &amp; settings</h1>
  <div class="set-grid">
    <div class="sheet">
      <h2>Backups</h2>
      <p class="muted">Everything is saved in this browser automatically. Keep at least one copy elsewhere.</p>
      <h3 style="margin-top:16px">Local file</h3>
      ${fsSupported ? `<p class="muted">Choose a file once, ideally in a folder that syncs (OneDrive, iCloud Drive, Dropbox). Every change is saved to it about 1.5 seconds later. If the file is updated from another device, newer data is loaded when you come back to this tab.</p>
        ${localHandle ? `<p class="status-line" id="local-status"></p>
        <label class="chk"><input type="checkbox" data-f="set-localauto" ${s.localAuto !== false ? 'checked' : ''}> Save to the file automatically after every change</label>
        <div class="btn-row"><button class="btn primary" data-act="local-reconnect">${localState === 'on' ? 'Save now' : 'Allow access to file'}</button><button class="btn" data-act="local-pick">Choose a different file…</button><button class="btn" data-act="local-stop">Stop</button></div>
        ${localState !== 'on' ? '<p class="status-line">After a restart Chrome asks again before the app can write to the file. Choose “Allow on every visit” and it won’t ask after future refreshes.</p>' : ''}`
        : `<div class="btn-row"><button class="btn primary" data-act="local-pick">Choose backup file…</button></div>`}`
        : `<p class="muted">Automatic file backup needs Chrome or Edge. In this browser, download a copy instead.</p>`}
      <div class="btn-row"><button class="btn" data-act="export">Download backup (.json)</button><button class="btn" data-act="pick-file">Restore from file…</button></div>
      ${s.exportLast ? `<p class="status-line">Last downloaded ${ago(s.exportLast)}.</p>` : ''}
      <p class="status-line">PDFs are kept in this browser only. After restoring on another device, drop them in again to reattach.</p>

      <h3 style="margin-top:22px">Google Drive</h3>
      <label class="field"><span>OAuth client ID</span><input type="text" data-f="set-gdid" value="${esc(s.gdClientId)}" placeholder="1234-abc.apps.googleusercontent.com" spellcheck="false">
        <small>Create a Web client ID in Google Cloud Console and add <b>${esc(orig)}</b> as an authorised JavaScript origin. The README has the steps.</small></label>
      <label class="chk"><input type="checkbox" data-f="set-gdauto" ${s.gdAuto ? 'checked' : ''}> Sync to Drive automatically after every change</label>
      <div class="btn-row">
        ${s.gdConnected ? `<button class="btn primary" data-act="gd-sync">Sync now</button>` : `<button class="btn primary" data-act="gd-connect" ${s.gdClientId ? '' : 'disabled'}>Connect Google Drive</button>`}
        <button class="btn" data-act="gd-restore" ${s.gdClientId ? '' : 'disabled'}>Restore from Drive</button>
        ${s.gdConnected ? '<button class="btn" data-act="gd-disconnect">Disconnect</button>' : ''}
      </div>
      <p class="status-line" id="gd-status"></p>
      <p class="status-line">${s.gdConnected ? `Signed in${s.gdEmail ? ' as ' + esc(s.gdEmail) : ''}. ` : ''}Every change is saved to ${BACKUP_NAME} in your Drive about 2 seconds later, and Drive keeps earlier versions. Opening the tracker on another device loads the newest copy. Google sign-ins last an hour; the app renews it on your next click (a popup may flash briefly).</p>
    </div>
    <div class="sheet">
      <h2>Question availability</h2>
      <p class="muted">A question tied to a lecture becomes available when that lecture…</p>
      <label class="radio"><input type="radio" name="um" data-f="set-unlock" value="date" ${s.unlockMode === 'date' ? 'checked' : ''}><span>has taken place (by its timetabled date)</span></label>
      <label class="radio"><input type="radio" name="um" data-f="set-unlock" value="watched" ${s.unlockMode === 'watched' ? 'checked' : ''}><span>has been marked watched by you</span></label>
      <p class="muted" style="margin-top:12px">Questions the guide doesn’t mention are…</p>
      <label class="radio"><input type="radio" name="us" data-f="set-unsched" value="available" ${s.unscheduled === 'available' ? 'checked' : ''}><span>available straight away (white)</span></label>
      <label class="radio"><input type="radio" name="us" data-f="set-unsched" value="locked" ${s.unscheduled === 'locked' ? 'checked' : ''}><span>locked until I set them (grey)</span></label>
      <h2 style="margin-top:22px">Lecture reviews</h2>
      <label class="field"><span>Days between reviews</span><input type="text" data-f="set-intervals" value="${s.intervals.join(', ')}">
        <small>First number: days from first watch to the 2nd review; next: 2nd to 3rd, and so on. Default 1, 7, 21.</small></label>
    </div>
  </div>`;
}

/* =========================================================
   Events
   ========================================================= */
function getP(d) { const c = cur(); return (d.kind === 'trip' ? c.tripos : c.papers).find(x => x.id === d.pid); }
function getQ(d) { return getP(d).questions[+d.q]; }
function goCourse(code, tab) { S.ui.view = 'course'; S.ui.course = code; if (tab) S.courses[code].tab = tab; save({ quiet: true }); render(); window.scrollTo({ top: 0 }); }

async function act(a, d) {
  const c = cur();
  switch (a) {
    case 'overview': case 'settings': S.ui.view = a; save({ quiet: true }); render(); window.scrollTo({ top: 0 }); return;
    case 'course': return goCourse(d.code);
    case 'goto': goCourse(d.code, d.tab); if (d.pid) { S.courses[d.code].activePaper = d.pid; render(); } return;
    case 'tab': c.tab = d.tab; save({ quiet: true }); return render();
    case 'paper': c.activePaper = d.id; save({ quiet: true }); return render();
    case 'trip': c.activeTrip = d.id; save({ quiet: true }); return render();
    case 'pick-file': return $('#file-any').click();

    case 'watch': { const l = c.lectures[+d.i]; l.watched = ymd(new Date(l.start)); break; }
    case 'unwatch': { const l = c.lectures[+d.i]; if (l.reviews.length && !confirm(`Clear the watched date and ${l.reviews.length} review date${l.reviews.length > 1 ? 's' : ''} for L${+d.i + 1}?`)) return; l.watched = null; l.reviews = []; break; }
    case 'rev': c.lectures[+d.i].reviews[+d.k] = todayStr(); break;
    case 'rev-clear': c.lectures[+d.i].reviews.splice(+d.k, 1); break;
    case 'edit-lec': c.editLec = c.lectures[+d.i].id; save({ quiet: true }); render(); { const el = $('input[data-f="lecdt"]'); if (el) el.focus(); } return;
    case 'edit-lec-done': { const el = $('input[data-f="lecdt"]'); if (el && el.value && el.value !== el.defaultValue) return applyLecDate(c, +el.dataset.i, el.value); c.editLec = null; save({ quiet: true }); return render(); }
    case 'add-col': c.reviewCols++; break;
    case 'rm-col': {
      const k = c.reviewCols - 1;
      if (c.lectures.some(l => l.reviews[k])) { toast(`Some lectures have a ${ordinal(k + 2)} review logged. Clear those first.`, 'err'); return; }
      c.reviewCols--; break;
    }
    case 'add-lec': {
      const v = prompt('Date and time of the lecture (YYYY-MM-DD HH:MM)', todayStr() + ' 09:00'); if (!v) return;
      const m = v.match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if (!m) { toast('Use the format 2026-10-15 09:00', 'err'); return; }
      const dt = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 9), +(m[5] || 0));
      c.lectures.push({ id: uid(), start: dt.toISOString(), end: new Date(dt.getTime() + 3600000).toISOString(), title: c.code + ' lecture (added by hand)', location: '', watched: null, reviews: [], note: '' });
      c.lectures.sort((a, b) => new Date(a.start) - new Date(b.start)); break;
    }
    case 'del-lec': if (!confirm(`Delete L${+d.i + 1}? Later lectures will be renumbered.`)) return; c.lectures.splice(+d.i, 1); break;

    case 'qs': { const q = getQ(d); q.status = d.s; if (d.s && !q.date) q.date = todayStr(); break; }
    case 'qcycle': { const q = getQ(d), order = ['', 'green', 'yellow', 'red']; q.status = order[(order.indexOf(q.status) + 1) % 4]; if (q.status && !q.date) q.date = todayStr(); break; }
    case 'nq': { const p = getP(d); if (!resizeQs(p, p.questions.length + +d.d)) return; break; }
    case 'pdf': return openPdf(d.key);
    case 'apply-sched': { const ta = $('textarea[data-f="schedtext"]'); return applyScheduleText(c, ta ? ta.value : c.scheduleText); }
    case 'add-paper': {
      const next = String((c.papers.map(p => +p.num).sort((a, b) => b - a)[0] || 0) + 1);
      const num = (prompt('Examples paper number', next) || '').trim(); if (!num) return;
      if (c.papers.some(p => p.num === String(+num || num))) { toast(`Paper ${num} already exists`, 'err'); return; }
      const n = parseInt(prompt('How many questions?', '10'), 10) || 0;
      const p = { id: uid(), num: String(+num || num), title: '', nq: 0, pdf: null, crib: null, questions: [] }; resizeQs(p, n);
      c.papers.push(p); c.papers.sort((a, b) => numSort(a.num, b.num)); c.activePaper = p.id; break;
    }
    case 'del-paper': case 'del-trip': {
      const p = getP(d), list = a === 'del-paper' ? c.papers : c.tripos;
      if (!confirm(`Delete ${a === 'del-paper' ? 'examples paper ' + p.num : 'tripos ' + p.year} and its progress?`)) return;
      [p.pdf, p.crib].filter(Boolean).forEach(k => idbDel(k).catch(() => {}));
      list.splice(list.indexOf(p), 1); break;
    }
    case 'add-trip': {
      const y = (prompt('Year of the tripos paper', String(new Date().getFullYear() - 1)) || '').trim(); if (!y) return;
      if (c.tripos.some(p => p.year === y)) { toast(`${y} already exists`, 'err'); return; }
      const p = { id: uid(), year: y, pdf: null, crib: null, nq: 0, questions: [] }; resizeQs(p, parseInt(prompt('How many questions on this paper?', '3'), 10) || 3);
      c.tripos.push(p); c.tripos.sort((a, b) => numSort(b.year, a.year)); c.activeTrip = p.id; break;
    }
    case 'del-course': {
      if (prompt(`Type ${c.code} to remove this course and all its progress.`) !== c.code) return;
      c.papers.concat(c.tripos).forEach(p => [p.pdf, p.crib].filter(Boolean).forEach(k => idbDel(k).catch(() => {})));
      delete S.courses[c.code]; S.order = S.order.filter(x => x !== c.code); S.ui.view = 'overview'; break;
    }
    case 'copy-q': {
      const groups = {};
      queryItems().forEach(x => (groups[`${x.code}, ${x.where}`] ||= []).push(`  Q${x.q} (${x.st === 'red' ? 'can’t do' : 'query'})${x.comment ? ': ' + x.comment : ''}`));
      const text = Object.entries(groups).map(([k, v]) => k + '\n' + v.join('\n')).join('\n\n');
      try { await navigator.clipboard.writeText(text); toast('Copied supervision list'); } catch (e) { prompt('Copy this:', text); }
      return;
    }
    case 'export': return exportBackup();
    case 'local-pick': await pickLocalFile(); return render();
    case 'local-reconnect': try { await reconnectLocal(); } catch (e) { toast(e.message, 'err'); } return render();
    case 'local-resolve': try { await localResolve(); } catch (e) { toast(e.message, 'err'); } return render();
    case 'local-stop': await stopLocal(); return render();
    case 'gd-connect': try { await gdConnect(); } catch (e) { toast(e.message, 'err'); } return render();
    case 'gd-sync': try { await gdSyncNow(); } catch (e) { toast(e.message, 'err'); } return render();
    case 'gd-resolve': try { await gdResolve(); } catch (e) { toast(e.message, 'err'); } return render();
    case 'sync-chip': { const to = d.to; if (to && to !== 'sync-chip') return act(to, {}); return act('settings', {}); }
    case 'gd-disconnect': {
      if (gdToken && window.google) try { google.accounts.oauth2.revoke(gdToken, () => {}); } catch (e) {}
      gdToken = null; gdExp = 0; gdStoreToken(); gdClient = null; clearTimeout(sync.timer); sync.phase = 'idle'; Object.assign(S.settings, { gdConnected: false, gdEmail: '', gdRemoteMod: '' }); save({ quiet: true }); toast('Disconnected from Google Drive'); return render();
    }
    case 'gd-restore': try { await gdRestore(); } catch (e) { toast(e.message, 'err'); } return render();
    default: return;
  }
  save(); render();
}

function applyLecDate(c, i, value) {
  if (!value) return;
  const l = c.lectures[i], old = new Date(l.start), nd = new Date(value);
  if (isNaN(nd)) { toast('That date isn’t complete yet.', 'err'); return; }
  const dur = new Date(l.end) - old || 3600000;
  if (l.watched === ymd(old)) l.watched = ymd(nd);
  l.start = nd.toISOString(); l.end = new Date(nd.getTime() + dur).toISOString();
  c.lectures.sort((a, b) => new Date(a.start) - new Date(b.start));
  const ni = c.lectures.indexOf(l);
  c.editLec = null; save(); render();
  toast(ni !== i ? `Moved to ${fmtDay(nd)}; it is now L${ni + 1} and later lectures were renumbered` : `L${i + 1} moved to ${fmtDay(nd)}, ${fmtTime(nd)}`);
}
/* “end of section 3”, “S3 end”, “finished §3” in a lecture's coverage marks where that handout section finishes,
   which is what unlocks section-based examples questions */
function coverageSections(c, i, text) {
  const found = new Set();
  const re1 = /\b(?:end(?:\s+of)?|finish(?:ed|es)?|complete[ds]?|done)\s*(?:section|handout|sec\.?|§|s)\s*(\d+)/gi;
  const re2 = /(?:section|handout|sec\.?|§|\bs)\s*(\d+)\s*(?:end(?:ed|s)?|finish(?:ed)?|complete[d]?|done)\b/gi;
  let m; while ((m = re1.exec(text))) found.add(String(+m[1])); while ((m = re2.exec(text))) found.add(String(+m[1]));
  if (!found.size) return;
  const changed = [];
  for (const k of found) {
    const sec = c.sections[k] ||= { after: null, done: false };
    if (sec.after !== i + 1) { sec.after = i + 1; changed.push(k); }
  }
  if (!changed.length) return;
  save(); render();
  toast(`Section ${changed.join(', ')} now ends after L${i + 1}, so its examples questions unlock from then.`);
}
const LIVE = new Set(['cname', 'lnote', 'lcov', 'qcom', 'ptitle', 'schedtext', 'qtime']);
function field(f, el, ev) {
  const c = cur(), d = el.dataset, i = +d.i, k = +d.k;
  if (f === 'lcov' && ev === 'change') { save(); return coverageSections(c, i, el.value); }
  if (LIVE.has(f) && ev === 'change') { if (f === 'cname') { save(); renderSide(); } else save(); return; }
  switch (f) {
    case 'cname': c.name = el.value; return saveSoon();
    case 'lnote': c.lectures[i].note = el.value; return saveSoon();
    case 'lcov': c.lectures[i].covered = el.value; return saveSoon();
    case 'qcom': getQ(d).comment = el.value; return saveSoon();
    case 'qtime': getQ(d).time = el.value; return saveSoon();
    case 'ptitle': getP(d).title = el.value; return saveSoon();
    case 'schedtext': c.scheduleText = el.value; return saveSoon();
    case 'wdate': if (el.value) { c.lectures[i].watched = el.value; save(); render(); } return;
    case 'rdate': if (el.value) { c.lectures[i].reviews[k] = el.value; save(); render(); } return;
    case 'qdate': getQ(d).date = el.value; return save();
    case 'qcrib': getQ(d).crib = el.checked; return save();
    case 'qunlock': {
      const p = getP(d), q = getQ(d), v = el.value.trim().toUpperCase().replace(/\s+/g, '');
      const sched = ((c.schedule[p.num] || {})[+d.q + 1]) || '';
      q.unlock = v === sched ? null : v; save(); return render();
    }
    case 'lecdt': return; // applied with the ✓ button or Enter, so a half-typed date doesn't close the editor
    case 'pnum': case 'tyear': {
      const p = getP(d), trip = f === 'tyear', list = trip ? c.tripos : c.papers;
      const v = trip ? el.value.trim() : String(+el.value.trim() || el.value.trim());
      if (!v) { toast(trip ? 'Enter a year' : 'Enter a paper number', 'err'); return render(); }
      if (list.some(x => x !== p && (trip ? x.year : x.num) === v)) { toast(`${trip ? 'Tripos ' : 'Examples paper '}${v} already exists in ${c.code}. Delete or renumber that one first.`, 'err'); return render(); }
      if (trip) p.year = v; else p.num = v;
      c.papers.sort((x, y) => numSort(x.num, y.num)); c.tripos.sort((x, y) => numSort(y.year, x.year));
      save(); render(); toast(trip ? `Now tripos ${v}` : `Now examples paper ${v}${c.schedule[v] ? ' (the question guide for P' + v + ' applies)' : ''}`); return;
    }
    case 'pmove': {
      const p = getP(d), to = S.courses[el.value]; if (!to || to === c) return;
      const trip = d.kind === 'trip', from = trip ? c.tripos : c.papers, dest = trip ? to.tripos : to.papers;
      const keyName = trip ? 'year' : 'num';
      if (dest.some(x => x[keyName] === p[keyName])) {
        const nv = trip ? (prompt(`${to.code} already has tripos ${p.year}. Year for this one?`) || '').trim() : String((dest.map(x => +x.num || 0).sort((a, b) => b - a)[0] || 0) + 1);
        if (!nv || dest.some(x => x[keyName] === nv)) { toast('Not moved: that number is taken.', 'err'); return render(); }
        p[keyName] = nv;
      }
      from.splice(from.indexOf(p), 1); dest.push(p);
      to.papers.sort((x, y) => numSort(x.num, y.num)); to.tripos.sort((x, y) => numSort(y.year, x.year));
      if (trip) to.activeTrip = p.id; else to.activePaper = p.id;
      to.tab = trip ? 'tripos' : 'examples'; S.ui.course = to.code;
      save(); render(); toast(`Moved to ${to.code} as ${trip ? 'tripos ' + p.year : 'examples paper ' + p.num}`); return;
    }
    case 'pfile': { const file = el.files[0]; el.value = ''; if (file) attachPdf(file, d).catch(e => toast(e.message, 'err')); return; }
    case 'secafter': c.sections[d.k].after = el.value ? +el.value : null; save(); return render();
    case 'secdone': c.sections[d.k].done = el.checked; save(); return render();
    case 'schedfile': { const file = el.files[0]; el.value = ''; if (file) importSchedule(file).catch(e => toast(e.message, 'err')); return; }
    case 'set-unlock': S.settings.unlockMode = el.value; save(); return render();
    case 'set-unsched': S.settings.unscheduled = el.value; save(); return render();
    case 'set-intervals': {
      const iv = el.value.split(/[,\s]+/).map(Number).filter(n => n > 0);
      if (!iv.length) { toast('Enter numbers of days, e.g. 1, 7, 21', 'err'); return render(); }
      S.settings.intervals = iv; save(); return render();
    }
    case 'set-gdid': S.settings.gdClientId = el.value.trim(); gdClient = null; save(); return render();
    case 'set-localauto': S.settings.localAuto = el.checked; save({ quiet: true }); if (el.checked) scheduleLocal(300); return renderSync();
    case 'set-gdauto': S.settings.gdAuto = el.checked; save({ quiet: true }); if (el.checked) scheduleDrive(500); return renderSync();
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  Promise.resolve(act(b.dataset.act, b.dataset)).catch(err => { console.error(err); toast(err.message, 'err'); });
});
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.dataset || t.dataset.f !== 'lecdt') return;
  if (e.key === 'Enter') { e.preventDefault(); applyLecDate(cur(), +t.dataset.i, t.value); }
  if (e.key === 'Escape') { cur().editLec = null; render(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.f) field(t.dataset.f, t, 'change'); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && LIVE.has(t.dataset.f)) field(t.dataset.f, t, 'input'); });
$('#file-any').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; handleFiles(fs, null); });

async function handleFiles(files, zone) {
  if (!zone && S.ui.view === 'course' && cur()) zone = { examples: 'paper', tripos: 'tripos' }[cur().tab] || null;
  if (zone === 'any') zone = null;
  const pdfs = [];
  for (const f of files) {
    const n = f.name.toLowerCase();
    try {
      if (n.endsWith('.ics') || f.type === 'text/calendar') importICS(await f.text(), f.name);
      else if (n.endsWith('.json')) await importBackupFile(f);
      else if (n.endsWith('.pdf')) pdfs.push(f);
      else if ((f.type || '').startsWith('image/') || n.endsWith('.txt')) await importSchedule(f);
      else toast(`${f.name}: drop .ics timetables, PDF papers, a screenshot or text of the question guide, or a .json backup.`, 'err');
    } catch (err) { console.error(err); toast(`${f.name}: ${err.message}`, 'err'); }
  }
  if (pdfs.length) {
    toast(`Reading ${pdfs.length} PDF${pdfs.length > 1 ? 's' : ''}…`);
    const rows = [];
    for (const f of pdfs) rows.push(await analysePdf(f, zone));
    /* guessed paper numbers: give each its own free number, so files in one drop don't land on the same paper */
    for (const r of rows.filter(x => x.kind === 'paper' && x.numNote.startsWith('guessed'))) {
      const code = r.code.toUpperCase(), used = new Set([...(S.courses[code] ? S.courses[code].papers.map(p => p.num) : []), ...rows.filter(o => o !== r && o.kind === 'paper' && o.code.toUpperCase() === code).map(o => o.num)]);
      let n = 1; while (used.has(String(n))) n++; r.num = String(n);
    }
    openImport(rows);
  }
}

/* Drag and drop anywhere */
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
function bannerText() {
  if (S.ui.view !== 'course' || !cur()) return 'Drop .ics timetables, PDFs or a backup to import';
  const t = cur().tab;
  return t === 'examples' ? `Drop examples papers, cribs or the question guide for ${cur().code}`
    : t === 'tripos' ? `Drop tripos papers for ${cur().code}` : `Drop .ics files to add lectures`;
}
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); $('#drag-banner').textContent = bannerText(); });
window.addEventListener('dragover', e => {
  if (!hasFiles(e)) return; e.preventDefault();
  const z = e.target.closest && e.target.closest('[data-drop]');
  document.querySelectorAll('.dz-hot').forEach(x => x !== z && x.classList.remove('dz-hot'));
  if (z) z.classList.add('dz-hot');
});
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const z = e.target.closest && e.target.closest('[data-drop]');
  document.querySelectorAll('.dz-hot').forEach(x => x.classList.remove('dz-hot'));
  handleFiles([...e.dataTransfer.files], z ? z.dataset.drop : null);
});
/* Paste a screenshot of the guide (on the Examples papers tab) */
document.addEventListener('paste', e => {
  if (S.ui.view !== 'course' || !cur() || cur().tab !== 'examples') return;
  const img = [...(e.clipboardData && e.clipboardData.files || [])].find(f => f.type.startsWith('image/'));
  if (img) { e.preventDefault(); importSchedule(img).catch(err => toast(err.message, 'err')); return; }
  const inField = e.target.closest && e.target.closest('input,textarea');
  if (!inField) {
    const text = e.clipboardData && e.clipboardData.getData('text');
    if (text && /section|lecture/i.test(text)) { e.preventDefault(); applyScheduleText(cur(), text.trim(), 'pasted'); }
  }
});

let lastRenew = 0;
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-act]');
  if (t && /^(gd-|local-|sync)/.test(t.dataset.act)) return;
  if (Date.now() - lastRenew < 120000) return;
  if (localHandle && localState === 'paused') {
    lastRenew = Date.now();
    localHandle.requestPermission({ mode: 'readwrite' }).then(async p => {
      if (p !== 'granted') return;
      localState = 'on'; renderSync(); if (S.ui.view === 'settings') renderMain();
      await localCheck(); scheduleLocal(300);
    }).catch(() => {});
    return;
  }
  /* renew Google sign-in shortly before it expires, so syncing never stalls */
  if (driveOn() && !gdFresh() && gdClient && navigator.onLine) {
    lastRenew = Date.now();
    const wasValid = gdValid();
    gdAuth(true).then(async () => {
      if (S.ui.view === 'settings') renderMain();
      if (!wasValid) await gdCheckRemote();
      runDriveSync();
    }).catch(() => {});
  }
}, true);

/* Another tab of the tracker saved: pick up its data so the two tabs don't fight */
window.addEventListener('storage', e => {
  if (e.key === STORE && e.newValue) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (err) {} }
  if (e.key === GD_TOKEN_KEY) { gdLoadToken(); renderSync(); }
});
window.addEventListener('online', () => { renderSync(); gdCheckRemote().then(() => scheduleDrive(500)); });
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (localDirty() && localOn()) { clearTimeout(lsync.timer); runLocalSync(); }
    if (driveDirty() && gdValid()) { clearTimeout(sync.timer); runDriveSync(); }
  } else {
    localCheck().then(() => scheduleLocal(400));
    gdCheckRemote().then(() => scheduleDrive(500));
  }
});

render();
initLocal();
if (driveOn()) {
  gdInit().catch(() => {});
  if (gdValid()) gdCheckRemote().then(() => scheduleDrive(800));
}
setInterval(() => { renderSide(); }, 60000);
setInterval(() => { if (document.visibilityState === 'visible') { gdCheckRemote(); localCheck(); } }, 5 * 60000);
</script>
